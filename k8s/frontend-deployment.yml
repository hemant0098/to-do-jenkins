apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
  namespace: jenkins-app
  labels:
    app: frontend-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-app
  template:
    metadata:
      labels:
        app: frontend-app
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: frontend-app
        image: 059310318163.dkr.ecr.ap-south-1.amazonaws.com/media-manager-frontend:v1.7
        env:
        - name: REACT_APP_BACKEND_URL
          value: "http://13.232.174.208:30001/api/tasks"
        ports:
        - containerPort: 80
          name: frontend-app